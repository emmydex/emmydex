<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arcNoir" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="55%" stop-color="#B0B0B0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="640" height="200" fill="#0A0A0A"/>

  <!-- Mark: three nodes on an ascending arc, fading from charcoal to white -->
  <g transform="translate(30, 30)">
    <path d="M 20 130 Q 40 60 90 40 Q 120 28 140 10"
          fill="none" stroke="url(#arcNoir)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="20" cy="130" r="11" fill="#4A4A4A"/>
    <circle cx="90" cy="45" r="11" fill="#B0B0B0"/>
    <circle cx="142" cy="9" r="13" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="215" y="105" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="46" fill="#FFFFFF" letter-spacing="0.5">Loopwise</text>
  <text x="217" y="140" font-family="Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="20" fill="#8A8A8A" letter-spacing="2.5">ANALYZE · LEARN · IMPROVE</text>
</svg>
